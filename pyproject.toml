[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mission4-memory"
version = "0.2.0"
description = "AI Agentathon Mission 4 - Memory and Context in AI Agents"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3,<2.0",
    "langchain-core>=1.3,<2.0",
    "langchain-deepseek>=1.0.1,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "python-dotenv>=1.2,<2.0",
    "pydantic>=2.12,<3.0",
    "gradio>=6.14,<7.0",
]

[tool.uv]
package = false
